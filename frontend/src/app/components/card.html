<div class="card" role="button" tabindex="0" (click)="clickHandler()" (keyup.enter)="clickHandler()">
    <div class="card-header">
        <h3 class="card-title">{{ comic().title }} {{ comic().issueNumber }}</h3>
    </div>
    <div class="card-body">
        <img [src]="comic().imageUrl" [alt]="comic().title" />
    </div>
</div>
